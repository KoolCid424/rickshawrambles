<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rickshaw Rambles</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    background:
        linear-gradient(
            rgba(8, 12, 18, 0.58),
            rgba(8, 12, 18, 0.72)
        ),
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2000&q=90")
        center center / cover no-repeat;
    color: white;
}

.page {
    width: 100%;
    height: 100vh;
    min-height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

.content {
    max-width: 700px;
    width: 100%;
    animation: fadeUp 1.2s ease forwards;
}

.logo {
    width: 150px;
    height: 150px;
    object-fit: contain;
    margin-bottom: 25px;
    filter: drop-shadow(0 8px 25px rgba(0,0,0,0.45));
}

.small-title {
    font-family: Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 5px;
    font-size: 12px;
    opacity: 0.8;
    margin-bottom: 18px;
}

h1 {
    font-size: clamp(42px, 7vw, 76px);
    line-height: 0.95;
    font-weight: 400;
    letter-spacing: -2px;
    text-shadow: 0 5px 25px rgba(0,0,0,0.45);
}

.subtitle {
    font-family: Arial, sans-serif;
    font-size: clamp(15px, 2vw, 19px);
    line-height: 1.6;
    max-width: 570px;
    margin: 25px auto 35px;
    color: rgba(255,255,255,0.88);
}

.book-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 210px;
    padding: 17px 32px;
    background: white;
    color: #10151b;
    border-radius: 50px;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow: 0 12px 35px rgba(0,0,0,0.35);
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

.book-button:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 45px rgba(0,0,0,0.45);
    background: #f2f2f2;
}

.book-button:active {
    transform: translateY(-1px);
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    .page {
        padding: 22px;
    }

    .logo {
        width: 105px;
        height: 105px;
        margin-bottom: 22px;
    }

    h1 {
        letter-spacing: -1px;
    }

    .subtitle {
        margin: 20px auto 28px;
    }

    .book-button {
        width: 100%;
        max-width: 280px;
    }
}
</style>
</head>

<body>

<div class="page">
    <main class="content">

        <img
            class="logo"
            src="https://i.ibb.co/xKXVDg1g/rickshaw-rambles.png"
            alt="Rickshaw Rambles Logo"
        >

        <div class="small-title">
            Explore the South Coast
        </div>

        <h1>Rickshaw Rambles</h1>

        <p class="subtitle">
            Discover beautiful places, fascinating stories and local history
            from the comfort of a Rickshaw Rambles ride.
        </p>

        <a
            class="book-button"
            href="https://getitbooked.app/book/rickshawrambles"
        >
            Book Online
        </a>

    </main>
</div>

</body>
</html>
```
