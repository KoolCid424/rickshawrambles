```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rickshaw Rambles</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    background:
        linear-gradient(
            rgba(8, 12, 18, 0.58),
            rgba(8, 12, 18, 0.72)
        ),
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2000&q=90")
        center center / cover no-repeat;

    color: white;
}


/* ================================
   LANDING PAGE
================================ */

.page {
    width: 100%;
    height: 100vh;
    min-height: 500px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 30px;
}

.content {
    max-width: 700px;
    width: 100%;

    animation: fadeUp 1.2s ease forwards;
}

.logo {
    width: 150px;
    height: 150px;

    object-fit: contain;

    margin-bottom: 25px;

    filter: drop-shadow(
        0 8px 25px rgba(0,0,0,0.45)
    );
}

.small-title {
    font-family: Arial, sans-serif;

    text-transform: uppercase;
    letter-spacing: 5px;

    font-size: 12px;

    opacity: 0.8;

    margin-bottom: 18px;
}

h1 {
    font-size: clamp(42px, 7vw, 76px);

    line-height: 0.95;

    font-weight: 400;

    letter-spacing: -2px;

    text-shadow:
        0 5px 25px rgba(0,0,0,0.45);
}

.subtitle {
    font-family: Arial, sans-serif;

    font-size: clamp(15px, 2vw, 19px);

    line-height: 1.6;

    max-width: 570px;

    margin: 25px auto 35px;

    color: rgba(255,255,255,0.88);
}


/* ================================
   BOOK BUTTON
================================ */

.book-button {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 210px;

    padding: 17px 32px;

    background: white;

    color: #10151b;

    border: none;

    border-radius: 50px;

    font-family: Arial, sans-serif;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.35);

    cursor: pointer;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

.book-button:hover {
    transform: translateY(-4px);

    box-shadow:
        0 18px 45px rgba(0,0,0,0.45);

    background: #f2f2f2;
}

.book-button:active {
    transform: translateY(-1px);
}


/* ================================
   BOOKING SCREEN
================================ */

.booking-screen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100vh;

    display: none;

    flex-direction: column;

    z-index: 1000;

    background:
        linear-gradient(
            rgba(8,12,18,0.82),
            rgba(8,12,18,0.90)
        ),
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2000&q=90")
        center center / cover no-repeat;
}


/* ================================
   BOOKING HEADER
================================ */

.booking-header {

    height: 72px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;

    background:
        rgba(8,12,18,0.75);

    border-bottom:
        1px solid rgba(255,255,255,0.12);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);
}

.booking-brand {

    display: flex;

    align-items: center;

    gap: 11px;

    font-size: 18px;
}

.booking-brand img {

    width: 43px;
    height: 43px;

    object-fit: contain;
}


/* ================================
   CANCEL BUTTON
================================ */

.cancel-button {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding: 10px 18px;

    border-radius: 30px;

    border:
        1px solid rgba(255,255,255,0.25);

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-family: Arial, sans-serif;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition:
        all 0.25s ease;
}

.cancel-button:hover {

    background:
        rgba(255,255,255,0.18);

    border-color:
        rgba(255,255,255,0.45);

    transform:
        translateY(-1px);
}


/* ================================
   BOOKING CONTENT
================================ */

.booking-area {

    flex: 1;

    overflow-y: auto;

    padding: 24px;
}

.booking-card {

    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

    background: white;

    color: #111827;

    border-radius: 22px;

    padding: 18px;

    box-shadow:
        0 25px 80px rgba(0,0,0,0.45);

    min-height: 500px;
}


/* THE IMPORTANT PART */

#booking-widget {

    width: 100%;

    min-height: 500px;
}


/* ================================
   ANIMATION
================================ */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

    .page {
        padding: 22px;
    }

    .logo {
        width: 105px;
        height: 105px;

        margin-bottom: 22px;
    }

    h1 {
        letter-spacing: -1px;
    }

    .subtitle {
        margin:
            20px auto 28px;
    }

    .book-button {

        width: 100%;

        max-width: 280px;
    }

    .booking-header {

        height: 65px;

        padding:
            0 15px;
    }

    .booking-brand {

        font-size: 15px;
    }

    .booking-brand img {

        width: 36px;
        height: 36px;
    }

    .cancel-button {

        padding:
            9px 14px;

        font-size: 12px;
    }

    .booking-area {

        padding: 10px;
    }

    .booking-card {

        padding: 7px;

        border-radius:
            16px;
    }

}

</style>
</head>


<body>


<!-- =====================================
     ORIGINAL LANDING PAGE
===================================== -->

<div class="page" id="landingPage">

    <main class="content">

        <img
            class="logo"
            src="https://i.ibb.co/xKXVDg1g/rickshaw-rambles.png"
            alt="Rickshaw Rambles Logo"
        >

        <div class="small-title">
            Explore the South Coast
        </div>

        <h1>
            Rickshaw Rambles
        </h1>

        <p class="subtitle">
            Discover beautiful places, fascinating stories and local history
            from the comfort of a Rickshaw Rambles ride.
        </p>

        <button
            class="book-button"
            onclick="openBooking()"
        >
            Book Online
        </button>

    </main>

</div>



<!-- =====================================
     BOOKING SCREEN
===================================== -->

<div
    class="booking-screen"
    id="bookingScreen"
>


    <!-- HEADER -->

    <header class="booking-header">

        <div class="booking-brand">

            <img
                src="https://i.ibb.co/xKXVDg1g/rickshaw-rambles.png"
                alt="Rickshaw Rambles"
            >

            <span>
                Rickshaw Rambles
            </span>

        </div>


        <button
            class="cancel-button"
            onclick="closeBooking()"
        >

            ← Cancel

        </button>

    </header>



    <!-- BOOKING AREA -->

    <main class="booking-area">

        <div class="booking-card">

            <!--
                GETITBOOKED MOUNTS HERE
            -->

            <div id="booking-widget"></div>

        </div>

    </main>


</div>



<!-- =====================================
     GETITBOOKED WIDGET
===================================== -->

<script
    src="https://getitbooked.app/widget.js"
    data-token="f924f9b0ffc6177e3fac8d99298480da82d964638251f1d7f418a0c4ae7d14af"
    data-target="booking-widget">
</script>



<!-- =====================================
     PAGE CONTROLS
===================================== -->

<script>

function openBooking() {

    document.getElementById("landingPage").style.display = "none";

    document.getElementById("bookingScreen").style.display = "flex";

}


function closeBooking() {

    document.getElementById("bookingScreen").style.display = "none";

    document.getElementById("landingPage").style.display = "flex";

}

</script>


</body>
</html>
```
