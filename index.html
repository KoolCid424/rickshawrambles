<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jacob's Vintage Bicycles</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;

    background:
        linear-gradient(
            rgba(25, 35, 27, 0.60),
            rgba(18, 27, 20, 0.78)
        ),
        url("https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=2200&q=90")
        center center / cover no-repeat;

    color: #f7f2e7;
}


/* =========================================
   LANDING PAGE
========================================= */

.page {
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;

    position: relative;
}


/* subtle vintage texture */

.page::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: 0.08;

    background-image:
        radial-gradient(
            rgba(255,255,255,0.8) 1px,
            transparent 1px
        );

    background-size: 4px 4px;
}


/* =========================================
   MAIN CONTENT
========================================= */

.content {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 780px;

    animation: fadeUp 1.1s ease forwards;
}


/* =========================================
   LOGO
========================================= */

.logo {
    width: 180px;
    height: 180px;

    object-fit: contain;

    margin-bottom: 18px;

    filter:
        drop-shadow(
            0 10px 22px rgba(0,0,0,0.45)
        );
}


/* =========================================
   EYEBROW
========================================= */

.small-title {

    font-family: Arial, sans-serif;

    text-transform: uppercase;

    letter-spacing: 5px;

    font-size: 11px;

    color: #ddd4bd;

    margin-bottom: 18px;
}


/* =========================================
   TITLE
========================================= */

h1 {

    font-size:
        clamp(42px, 7vw, 76px);

    line-height: 0.92;

    font-weight: 400;

    letter-spacing: -2px;

    color: #fffaf0;

    text-shadow:
        0 6px 25px rgba(0,0,0,0.45);
}


/* =========================================
   DECORATIVE LINE
========================================= */

.divider {

    width: 90px;

    height: 1px;

    background: #d6c59f;

    margin:
        24px auto 22px;

    opacity: 0.8;
}


/* =========================================
   SUBTITLE
========================================= */

.subtitle {

    font-family: Arial, sans-serif;

    font-size:
        clamp(15px, 2vw, 18px);

    line-height: 1.65;

    max-width: 610px;

    margin:
        0 auto 34px;

    color:
        rgba(255,250,240,0.88);
}


/* =========================================
   BOOK BUTTON
========================================= */

.book-button {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 225px;

    padding:
        17px 34px;

    background:
        #f4eee1;

    color:
        #263529;

    border:
        1px solid rgba(255,255,255,0.3);

    border-radius: 3px;

    font-family:
        Arial, sans-serif;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 2px;

    text-transform: uppercase;

    cursor: pointer;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.35);

    transition:
        all 0.3s ease;
}


.book-button:hover {

    transform:
        translateY(-4px);

    background:
        #fffaf0;

    box-shadow:
        0 18px 45px rgba(0,0,0,0.45);
}


.book-button:active {

    transform:
        translateY(-1px);
}


/* =========================================
   BOOKING SCREEN
========================================= */

.booking-screen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100vh;

    display: none;

    flex-direction: column;

    z-index: 1000;

    background:

        linear-gradient(
            rgba(25,35,27,0.88),
            rgba(18,27,20,0.94)
        ),

        url("https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=2200&q=90")
        center center / cover no-repeat;
}


/* =========================================
   BOOKING HEADER
========================================= */

.booking-header {

    height: 74px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 28px;

    background:
        rgba(19,28,21,0.82);

    border-bottom:
        1px solid rgba(255,255,255,0.13);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);
}


.booking-brand {

    display: flex;

    align-items: center;

    gap: 12px;

    font-size: 18px;

    color: #f7f2e7;
}


.booking-brand img {

    width: 45px;
    height: 45px;

    object-fit: contain;
}


/* =========================================
   CANCEL BUTTON
========================================= */

.cancel-button {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding:
        10px 18px;

    border:
        1px solid rgba(255,255,255,0.25);

    border-radius: 30px;

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-family:
        Arial, sans-serif;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition:
        all 0.25s ease;
}


.cancel-button:hover {

    background:
        rgba(255,255,255,0.18);

    border-color:
        rgba(255,255,255,0.45);

    transform:
        translateY(-1px);
}


/* =========================================
   BOOKING AREA
========================================= */

.booking-area {

    flex: 1;

    overflow-y: auto;

    padding:
        24px;
}


.booking-card {

    width: 100%;

    max-width: 1100px;

    min-height: 500px;

    margin:
        0 auto;

    padding: 18px;

    background:
        #f8f5ed;

    color:
        #202820;

    border-radius:
        18px;

    box-shadow:
        0 25px 80px rgba(0,0,0,0.45);
}


/* =========================================
   GETITBOOKED TARGET
========================================= */

#booking-widget {

    width: 100%;

    min-height: 500px;
}


/* =========================================
   ANIMATION
========================================= */

@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(25px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .page {

        padding:
            20px;
    }


    .logo {

        width: 120px;
        height: 120px;

        margin-bottom: 15px;
    }


    h1 {

        letter-spacing:
            -1px;
    }


    .subtitle {

        margin-bottom:
            27px;
    }


    .book-button {

        width: 100%;

        max-width: 290px;
    }


    .booking-header {

        height: 65px;

        padding:
            0 15px;
    }


    .booking-brand {

        font-size:
            15px;
    }


    .booking-brand img {

        width: 37px;
        height: 37px;
    }


    .cancel-button {

        padding:
            9px 14px;

        font-size:
            12px;
    }


    .booking-area {

        padding:
            10px;
    }


    .booking-card {

        padding:
            7px;

        border-radius:
            14px;
    }

}

</style>
</head>


<body>


<!-- ========================================
     LANDING PAGE
======================================== -->

<div
    class="page"
    id="landingPage"
>

    <main class="content">


        <img
            class="logo"
            src="https://i.postimg.cc/rwYb6343/transparent-logo.png"
            alt="Jacob's Vintage Bicycles"
        >


        <div class="small-title">

            EST. VINTAGE CYCLING EXPERIENCES

        </div>


        <h1>

            Jacob's<br>
            Vintage Bicycles

        </h1>


        <div class="divider"></div>


        <p class="subtitle">

            Ride a little piece of cycling history.
            Discover an eccentric collection of remarkable
            bicycles, from penny farthings and classic tandems
            to iconic bikes from decades gone by.

        </p>


        <button
            class="book-button"
            onclick="openBooking()"
        >

            Book an Experience

        </button>


    </main>

</div>



<!-- ========================================
     BOOKING SCREEN
======================================== -->

<div
    class="booking-screen"
    id="bookingScreen"
>


    <header class="booking-header">


        <div class="booking-brand">


            <img
                src="https://i.postimg.cc/rwYb6343/transparent-logo.png"
                alt="Jacob's Vintage Bicycles"
            >


            <span>
                Jacob's Vintage Bicycles
            </span>


        </div>


        <button
            class="cancel-button"
            onclick="closeBooking()"
        >

            ← Cancel

        </button>


    </header>



    <main class="booking-area">


        <div class="booking-card">


            <div
                id="booking-widget"
            ></div>


        </div>


    </main>


</div>



<!-- ========================================
     GETITBOOKED
======================================== -->

<script
    src="https://getitbooked.app/widget.js"
    data-token="f924f9b0ffc6177e3fac8d99298480da82d964638251f1d7f418a0c4ae7d14af"
    data-target="booking-widget">
</script>



<!-- ========================================
     CONTROLS
======================================== -->

<script>

function openBooking() {

    document.getElementById(
        "landingPage"
    ).style.display = "none";


    document.getElementById(
        "bookingScreen"
    ).style.display = "flex";

}


function closeBooking() {

    document.getElementById(
        "bookingScreen"
    ).style.display = "none";


    document.getElementById(
        "landingPage"
    ).style.display = "flex";

}

</script>


</body>
</html>
