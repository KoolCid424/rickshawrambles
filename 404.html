<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Jacob's Vintage Bicycles</title>

    <link rel="icon" type="image/png"
        href="https://i.postimg.cc/rwYb6343/transparent-logo.png">

    <link rel="apple-touch-icon"
        href="https://i.postimg.cc/rwYb6343/transparent-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --green: #17372d;
            --deep-green: #0d241e;
            --cream: #f5f0e5;
            --paper: #eee6d4;
            --gold: #b99a5b;
            --dark: #18221e;
            --muted: #697169;
            --white: #fffdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background: var(--cream);
            color: var(--dark);
        }

        /* Header */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 42px;

            background: rgba(245, 240, 229, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(23, 55, 45, 0.08);

            z-index: 10;
        }

        .logo {
            width: 115px;
            display: block;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 12px 18px;

            border: 1px solid rgba(23, 55, 45, 0.2);
            border-radius: 999px;

            color: var(--green);
            text-decoration: none;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;

            transition: 0.25s ease;
        }

        .back-home:hover {
            background: var(--green);
            color: var(--white);
            border-color: var(--green);
            transform: translateY(-2px);
        }

        /* Main */

        main {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 130px 25px 70px;

            position: relative;
            overflow: hidden;
        }

        /* Very subtle background detail */

        main::before {
            content: "404";

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            font-family: "Cormorant Garamond", serif;
            font-size: min(55vw, 650px);
            font-weight: 600;

            color: rgba(23, 55, 45, 0.025);

            line-height: 1;

            pointer-events: none;
            user-select: none;
        }

        .content {
            position: relative;
            z-index: 2;

            max-width: 700px;
        }

        .label {
            color: var(--gold);

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;

            margin-bottom: 18px;
        }

        .number {
            font-family: "Cormorant Garamond", serif;

            color: var(--green);

            font-size: clamp(150px, 24vw, 260px);
            line-height: 0.72;

            font-weight: 600;
            letter-spacing: -0.06em;

            margin-bottom: 48px;
        }

        .divider {
            width: 70px;
            height: 1px;

            margin: 0 auto 30px;

            background: var(--gold);
        }

        h1 {
            font-family: "Cormorant Garamond", serif;

            color: var(--green);

            font-size: clamp(42px, 6vw, 68px);
            line-height: 0.98;

            font-weight: 600;

            margin-bottom: 20px;
        }

        p {
            max-width: 510px;
            margin: 0 auto 32px;

            color: var(--muted);

            font-size: 16px;
            line-height: 1.8;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            min-height: 52px;

            padding: 0 27px;

            background: var(--green);
            color: var(--white);

            border-radius: 999px;

            text-decoration: none;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;

            box-shadow: 0 12px 30px rgba(13, 36, 30, 0.14);

            transition: 0.25s ease;
        }

        .button span {
            font-size: 18px;
            transition: transform 0.25s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 35px rgba(13, 36, 30, 0.2);
        }

        .button:hover span {
            transform: translateX(4px);
        }

        .footer-note {
            position: absolute;

            bottom: 24px;
            left: 50%;

            transform: translateX(-50%);

            width: max-content;
            max-width: calc(100% - 40px);

            color: rgba(24, 34, 30, 0.4);

            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Mobile */

        @media (max-width: 600px) {

            header {
                height: 76px;
                padding: 15px 18px;
            }

            .logo {
                width: 90px;
            }

            .back-home {
                padding: 10px 13px;
                font-size: 10px;
            }

            main {
                padding-top: 105px;
            }

            .number {
                font-size: 145px;
                margin-bottom: 42px;
            }

            h1 {
                font-size: 45px;
            }

            p {
                font-size: 15px;
                line-height: 1.7;
            }

            .button {
                width: 100%;
                max-width: 310px;
            }

            .footer-note {
                font-size: 8px;
                letter-spacing: 0.1em;
            }
        }
    </style>
</head>

<body>

    <header>

        <a href="index.html" aria-label="Jacob's Vintage Bicycles home">
            <img
                src="https://i.postimg.cc/rwYb6343/transparent-logo.png"
                alt="Jacob's Vintage Bicycles"
                class="logo"
            >
        </a>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </header>


    <main>

        <div class="content">

            <div class="label">
                Route not found
            </div>

            <div class="number">
                404
            </div>

            <div class="divider"></div>

            <h1>
                Looks like you've<br>
                taken a wrong turn.
            </h1>

            <p>
                The page you're looking for doesn't seem to be on our route.
                It may have moved, disappeared, or simply never existed.
            </p>

            <a href="index.html" class="button">
                Return Home
                <span>→</span>
            </a>

        </div>

        <div class="footer-note">
            Jacob's Vintage Bicycles · Vintage Cycling Experiences
        </div>

    </main>

</body>
</html>
